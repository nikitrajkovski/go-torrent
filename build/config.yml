version: "3"

info:
  productName: TorrentGo
  productIdentifier: io.torrentgo.app
  productVersion: 0.1.0
  companyName: TorrentGo Contributors
  productDescription: A lightweight BitTorrent desktop client

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - bin
      - frontend
      - node_modules
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task install:frontend:deps
      type: once
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary
