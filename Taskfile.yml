version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: Torrade
  BIN_DIR: bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Build Torrade for this host platform
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Create the host platform's distributable package
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Run the built application
    cmds:
      - task: "{{OS}}:run"

  check:
    summary: Run backend tests and a strict frontend build
    deps:
      - task: common:build:frontend
    cmds:
      - go test ./...

  test:race:
    summary: Run the engine and persistence tests under Go's race detector
    cmds:
      - go test -race ./internal/config ./internal/platform ./internal/storage ./internal/torrent
