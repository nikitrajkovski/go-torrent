name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Debian installer
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Set build version
        run: node scripts/set-build-version.mjs "$APP_VERSION"
      - name: Build Debian package
        run: "$(go env GOPATH)/bin/wails3 task linux:package"
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Torrade-${{ env.APP_VERSION }}-linux-deb
          path: bin/Torrade.deb
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          $nsisBin = @(
            "$env:ProgramFiles\\NSIS"
            "${env:ProgramFiles(x86)}\\NSIS"
          ) | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          if (-not $nsisBin) { throw "NSIS installation did not provide makensis.exe" }
          $nsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Set build version
        run: node scripts/set-build-version.mjs $env:APP_VERSION
      - name: Build Windows installer
        shell: bash
        run: "$(go env GOPATH)/bin/wails3 task windows:package"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Torrade-${{ env.APP_VERSION }}-windows-installer
          path: bin/Torrade-amd64-installer.exe
          if-no-files-found: error
