name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend with TypeScript checks
        working-directory: frontend
        run: npm run build
      - name: Run Go tests
        run: go test ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Build production application
        shell: bash
        run: "$(go env GOPATH)/bin/wails3 build"
